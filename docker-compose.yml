name: ug-utag-portal

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utag_portal}
      POSTGRES_USER: ${POSTGRES_USER:-utag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - portal_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - portal_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-utag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-utag}
    volumes:
      - portal_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-replace-me}
    volumes:
      - portal_objects:/data
    ports:
      - "9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-me}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-utag-media}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}";
        do sleep 2; done;
        mc mb --ignore-existing "local/$${MEDIA_BUCKET}";
        mc anonymous set none "local/$${MEDIA_BUCKET}"

  clamav:
    # Official Debian image is multi-architecture (amd64, arm64, ppc64le).
    image: clamav/clamav-debian:1.5.3
    volumes:
      - portal_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-utag}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-utag_portal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-utag}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-utag}
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-me}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-utag-media}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1","api"]}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
    command: ["sh", "-c", "alembic upgrade head && python -m utag_api.cli seed && uvicorn utag_api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-utag}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-utag_portal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-utag}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-utag}
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-me}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-utag-media}
      CLAMAV_HOST: clamav
      MALWARE_SCAN_REQUIRED: "true"
    command: ["celery", "-A", "utag_api.worker.celery_app", "worker", "--loglevel=INFO", "--queues=default,communications,media,imports"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-utag}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-utag_portal}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-utag}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-utag}
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["celery", "-A", "utag_api.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    env_file:
      - path: .env
        required: false
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    profiles: ["production"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-operations@example.org}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - portal_caddy_data:/data
      - portal_caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - portal_prometheus:/prometheus
    secrets:
      - metrics_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  portal_postgres:
  portal_redis:
  portal_rabbitmq:
  portal_objects:
  portal_clamav:
  portal_caddy_data:
  portal_caddy_config:
  portal_prometheus:

secrets:
  metrics_token:
    environment: METRICS_BEARER_TOKEN
