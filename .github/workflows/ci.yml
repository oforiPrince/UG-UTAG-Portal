name: quality

on:
  pull_request:
  push:
    branches: [main, deploy_v1, deploy_v2]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e 'apps/api[dev]'
      - run: ruff check apps/api
      - run: pip-audit --local --skip-editable
      - run: python -m py_compile apps/api/scripts/legacy_migration.py
      - run: mypy src
        working-directory: apps/api
      - run: pytest --cov-fail-under=55
        working-directory: apps/api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @utag/web lint
      - run: pnpm --filter @utag/web typecheck
      - run: pnpm --filter @utag/web test
      - run: pnpm --filter @utag/web build
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm --filter @utag/web exec playwright install --with-deps chromium
      - run: pnpm --filter @utag/web test:e2e

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: utag_portal_test
          POSTGRES_USER: utag
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utag -d utag_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://utag:ci-only-password@localhost:5432/utag_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: alembic check
        working-directory: apps/api
      - run: alembic downgrade base && alembic upgrade head
        working-directory: apps/api
      - run: python -m utag_api.cli seed
        working-directory: apps/api

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, database]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api web postgres proxy
